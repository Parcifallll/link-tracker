server:
  port: 8081

spring:
  application:
    name: scrapper
  grpc:
    client:
      channels:
        bot:
          address: localhost:9090
    server:
      port: 9091

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  liquibase:
    change-log: file:migrations/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  data:
    redis:
      host: localhost
      port: 6379

app:
  database:
    access-type: ORM
  kafka:
    topics:
      github-updates: github-updates
      stackoverflow-updates: stackoverflow-updates
      fallback: unknown-updates

  # not used, managed by resilience
  notification:
    type: kafka # {kafka, grpc}

  cache:
    ttl: 10m

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}

  github:
    token: ${GITHUB_TOKEN}

  bot:
    url: http://localhost:8080

  scheduler:
    interval: 30s
    batch-size: 100

  resilience:
    timeout:
      connect: 3s
      read: 5s

    retry:
      max-attempts: 3
      wait-duration: 1s
      retryable-statuses: [ 500, 502, 503, 504 ]

    circuit-breaker:
      sliding-window-size: 10
      minimum-required-calls: 5
      failure-rate-threshold: 50.0
      permitted-calls-in-half-open-state: 5
      wait-duration-in-open-state: 10s

    rate-limiter:
      limit-for-period: 50
      limit-refresh-period: 1s
      timeout-duration: 0s

logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    backend.academy.linktracker: WARN
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.testcontainers: WARN
    org.apache.kafka.common.metrics: WARN
