server:
  port: ${SCRAPPER_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: scrapper

  lifecycle:
    timeout-per-shutdown-phase: 30s

  liquibase:
    enabled: false

  grpc:
    server:
      port: ${SCRAPPER_GRPC_SERVER_PORT:9090}
    client:
      channels:
        bot:
          address: ${BOT_GRPC_ADDRESS:localhost:9091}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:link-tracker}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: ${VALKEY_TIMEOUT:2s}
      connect-timeout: ${VALKEY_CONNECT_TIMEOUT:2s}
      # Sentinel включается переменными окружения, host/port тогда игнорируются:
      #   SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      #   SPRING_DATA_REDIS_SENTINEL_NODES=host1:26379,host2:26379,host3:26379

management:
  endpoint:
    health:
      probes:
        enabled: true

app:
  database:
    access-type: ${DB_ACCESS_TYPE:ORM}

  kafka:
    topics:
      github-updates: ${KAFKA_TOPIC_GITHUB:github-updates}
      stackoverflow-updates: ${KAFKA_TOPIC_STACKOVERFLOW:stackoverflow-updates}
      fallback: ${KAFKA_TOPIC_FALLBACK:unknown-updates}

  notification:
    type: ${NOTIFICATION_TYPE:kafka}   # kafka/grpc

  cache:
    ttl: ${CACHE_TTL:10m}

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}

  github:
    token: ${GITHUB_TOKEN}

  scheduler:
    interval: ${SCHEDULER_INTERVAL:30s}
    batch-size: ${SCHEDULER_BATCH_SIZE:100}

  resilience:
    timeout:
      connect: 3s
      read: 5s

    retry:
      max-attempts: 3
      wait-duration: 1s
      retryable-statuses: [ 500, 502, 503, 504 ]

    circuit-breaker:
      sliding-window-size: 10
      minimum-required-calls: 5
      failure-rate-threshold: 50.0
      permitted-calls-in-half-open-state: 5
      wait-duration-in-open-state: 10s

    rate-limiter:
      limit-for-period: 50
      limit-refresh-period: 1s
      timeout-duration: 0s

logging:
  structured:
    format:
      console: ecs
