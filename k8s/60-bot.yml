apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-config
  namespace: link-tracker
data:
  TELEGRAM_DEBUG: "false"
  SCRAPPER_GRPC_ADDRESS: scrapper:9090
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: link-tracker
spec:
  selector:
    app: bot
  ports:
    - { name: http, port: 8081, targetPort: http }
    - { name: grpc, port: 9091, targetPort: grpc }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: link-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: link-tracker/bot:0.0.1
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8081 }
            - { name: grpc, containerPort: 9091 }
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: bot-config
          env:
            - name: APP_TELEGRAM_TOKEN
              valueFrom: { secretKeyRef: { name: link-tracker-secrets, key: APP_TELEGRAM_TOKEN } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1024Mi }
