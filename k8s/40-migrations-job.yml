apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: link-tracker
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: liquibase
          image: link-tracker/migrations:0.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: link-tracker-secrets, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: link-tracker-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: link-tracker-secrets, key: POSTGRES_PASSWORD } }
          args:
            - --searchPath=.
            - --changelog-file=db.changelog-master.xml
            - --driver=org.postgresql.Driver
            - --url=jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - --username=$(POSTGRES_USER)
            - --password=$(POSTGRES_PASSWORD)
            - update

