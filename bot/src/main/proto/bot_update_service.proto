syntax = "proto3";

option java_package = "backend.academy.linktracker.grpc";
option java_multiple_files = true;

package linktracker;

service BotUpdateService {
    rpc SendUpdate (SendUpdateRequest) returns (SendUpdateResponse);
}

message SendUpdateRequest {
    int64 id = 1;
    string url = 2;
    string description = 3;
    repeated int64 tg_chat_ids = 4;
}

message SendUpdateResponse {
    bool success = 1;
}
