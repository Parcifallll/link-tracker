server:
  port: ${BOT_SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: bot

  lifecycle:
    timeout-per-shutdown-phase: 30s

  grpc:
    server:
      port: ${BOT_GRPC_SERVER_PORT:9091}
    client:
      channels:
        scrapper:
          address: ${SCRAPPER_GRPC_ADDRESS:localhost:9090}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:bot-consumer-group}
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: backend.academy.linktracker.bot.dto.LinkUpdate

management:
  endpoint:
    health:
      probes:
        enabled: true

app:
  telegram:
    url: ${TELEGRAM_API_URL:https://api.telegram.org/bot}
    token: ${APP_TELEGRAM_TOKEN}
    update-listener-sleep: ${TELEGRAM_UPDATE_LISTENER_SLEEP:1s}
    debug: ${TELEGRAM_DEBUG:false}

logging:
  structured:
    format:
      console: ecs
