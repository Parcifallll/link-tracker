services:
  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changesets
    command:
      - --searchPath=.
      - --changelog-file=db.changelog-master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}
      - update
    volumes:
      - ./migrations:/changesets

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-controller:
    container_name: kafka-controller
    image: confluentinc/cp-kafka:7.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka-controller:29092,CONTROLLER://kafka-controller:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-controller:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkQrdeSnT2ePEKGSRJvskQ
    ports:
      - "9092:9092"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Valkey Sentinel cluster ---

  valkey-master:
    container_name: valkey-master
    image: valkey/valkey:8-alpine
    command: valkey-server --protected-mode no
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-replica-1:
    container_name: valkey-replica-1
    image: valkey/valkey:8-alpine
    command: valkey-server --replicaof valkey-master 6379 --protected-mode no
    ports:
      - "6380:6379"
    depends_on:
      valkey-master:
        condition: service_healthy

  valkey-replica-2:
    container_name: valkey-replica-2
    image: valkey/valkey:8-alpine
    command: valkey-server --replicaof valkey-master 6379 --protected-mode no
    ports:
      - "6381:6379"
    depends_on:
      valkey-master:
        condition: service_healthy

  valkey-sentinel-1:
    container_name: valkey-sentinel-1
    image: valkey/valkey:8-alpine
    command: >
      sh -c "
        sleep 5 &&
        echo 'port 26379' > /tmp/sentinel.conf &&
        echo 'protected-mode no' >> /tmp/sentinel.conf &&
        echo 'sentinel monitor mymaster valkey-master 6379 2' >> /tmp/sentinel.conf &&
        echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-ip valkey-sentinel-1' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-port 26379' >> /tmp/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
        valkey-sentinel /tmp/sentinel.conf"
    ports:
      - "26379:26379"
    depends_on:
      valkey-master:
        condition: service_healthy

  valkey-sentinel-2:
    container_name: valkey-sentinel-2
    image: valkey/valkey:8-alpine
    command: >
      sh -c "
        sleep 5 &&
        echo 'port 26379' > /tmp/sentinel.conf &&
        echo 'protected-mode no' >> /tmp/sentinel.conf &&
        echo 'sentinel monitor mymaster valkey-master 6379 2' >> /tmp/sentinel.conf &&
        echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-ip valkey-sentinel-2' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-port 26379' >> /tmp/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
        valkey-sentinel /tmp/sentinel.conf"
    ports:
      - "26380:26379"
    depends_on:
      valkey-master:
        condition: service_healthy

  valkey-sentinel-3:
    container_name: valkey-sentinel-3
    image: valkey/valkey:8-alpine
    command: >
      sh -c "
        sleep 5 &&
        echo 'port 26379' > /tmp/sentinel.conf &&
        echo 'protected-mode no' >> /tmp/sentinel.conf &&
        echo 'sentinel monitor mymaster valkey-master 6379 2' >> /tmp/sentinel.conf &&
        echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-ip valkey-sentinel-3' >> /tmp/sentinel.conf &&
        echo 'sentinel announce-port 26379' >> /tmp/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
        valkey-sentinel /tmp/sentinel.conf"
    ports:
      - "26381:26379"
    depends_on:
      valkey-master:
        condition: service_healthy

volumes:
  postgres_data:
